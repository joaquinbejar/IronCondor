# cargo-deny configuration — supply-chain gate for `ironcondor`.
#
# Wired into CI (`.github/workflows/ci.yml`, job `deny`) from v0.1 so a new
# RUSTSEC advisory, a disallowed licence, or a banned / unknown source fails the
# build (docs/07 §10 supply-chain controls, docs/TESTING.md §12.4).
#
# `Cargo.lock` is committed and pins the exact audited tree; its sha256 travels
# in every bundle manifest as `lockfile_sha256` build provenance (v0.3 bundle
# writer, docs/07 §10). Keep the allow-lists explicit — never a blanket
# allow-all.
#
# Schema: cargo-deny 0.19.

# ---------------------------------------------------------------------------
# Advisories — RUSTSEC database (vulnerabilities, unmaintained, unsound, yanked)
# ---------------------------------------------------------------------------
[advisories]
# Yanked crates are a hard failure — the pinned lockfile must resolve to live
# crates only.
yanked = "deny"
# NO advisory is ignored (mirrors .cargo/audit.toml). The two former ignores —
# `paste` (RUSTSEC-2024-0436) and `rkyv 0.7` (RUSTSEC-2026-0235) — were retired
# on 2026-09-04 when the optionstratlib 0.18 -> 0.21 refresh dropped both crates
# from the resolved graph (`cargo tree -i <crate> --all-features --target all`
# prints nothing). cargo-deny resolves the ACTUAL graph, so an ignore for an
# absent crate is itself a warning (`advisory-not-detected`); keep this list
# empty until a real, documented exception exists.
ignore = []

# ---------------------------------------------------------------------------
# Licences — explicit permissive allow-list (SPDX). No blanket allow.
# ---------------------------------------------------------------------------
[licenses]
# Every licence expression in the current dependency tree resolves to one of
# these permissive licences. Confirmed with `cargo deny check licenses`.
allow = [
    "MIT",
    "Apache-2.0",
    # `target-lexicon` (build-dep of pyo3-build-config, the `python` feature,
    # #38) is licensed `Apache-2.0 WITH LLVM-exception` with NO OR-fallback —
    # the plain `Apache-2.0` allow does not satisfy a WITH expression. The LLVM
    # exception only RELAXES Apache-2.0 (drops the §4 binary-redistribution
    # attribution requirement), so it is strictly more permissive.
    "Apache-2.0 WITH LLVM-exception",
    # The rustls TLS stack behind the `simulator` feature's reqwest client —
    # `aws-lc-rs` / `aws-lc-sys` (`ISC AND …`, the crypto provider since reqwest
    # 0.13), `untrusted`, `rustls-webpki`, and the lockfile-only `ring`
    # (`Apache-2.0 AND ISC`) — carries ISC, an OSI-approved permissive licence
    # functionally equivalent to MIT. These
    # were previously unchecked because the deny gate resolved default features
    # only (fixed at #38: CI now runs `cargo deny --all-features check`).
    "ISC",
    # `webpki-root-certs` (the Mozilla CA-root data `rustls-platform-verifier`
    # carries as its fallback since reqwest 0.13; the simulator client trusts
    # the OS store at runtime) ships as data under CDLA-Permissive-2.0 — a
    # permissive data licence (attribution-only, no copyleft).
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "0BSD",
    "Zlib",
    # `bzip2 v0.6.1` (transitive: optionstratlib -> zip -> bzip2) is the ONLY
    # crate under the `bzip2-1.0.6` SPDX licence — a permissive BSD-style
    # licence. A scoped `[licenses.exceptions]` is the natural home for it, but
    # cargo-deny 0.19 reports the exception "not encountered" for a crate whose
    # sole licence IS the exception licence, so it is named explicitly here
    # instead. Still an explicit, named permissive allow — never a blanket.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Bans — duplicate versions, wildcards
# ---------------------------------------------------------------------------
[bans]
# The upstream numeric / async stacks legitimately pull duplicate major versions
# (e.g. rand 0.8 & 0.10, thiserror 1 & 2, getrandom 0.2 / 0.3 / 0.4). Surface
# them as a warning for visibility, but do not fail the build on a transitive
# duplicate we do not control.
multiple-versions = "warn"
# A `*` version requirement is an unpinned-dependency smell; flag it.
wildcards = "warn"
highlight = "all"

# ---------------------------------------------------------------------------
# Sources — where crates may come from
# ---------------------------------------------------------------------------
[sources]
# Only the public crates.io registry is permitted; an unknown registry or an
# unvetted git source fails the build.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
