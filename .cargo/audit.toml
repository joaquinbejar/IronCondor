# cargo-audit configuration — RUSTSEC advisory gate for `ironcondor`.
#
# Read by the `audit` CI job (`.github/workflows/ci.yml`), which runs
# `cargo audit --deny warnings` from the repo root so that ANY advisory — a
# vulnerability OR an unmaintained/unsound warning — fails the build, EXCEPT the
# two documented ignores below. Kept green from v0.1 (docs/07 §10,
# docs/TESTING.md §12.4).

[advisories]
# NO advisory is ignored. The two former ignores were retired on 2026-09-04 by
# the dependency refresh that moved optionstratlib 0.18 -> 0.21 (and its
# numeric stack with it): `paste` (RUSTSEC-2024-0436, unmaintained) and
# `rkyv 0.7` (RUSTSEC-2026-0235, via rust_decimal's optional feature) both left
# the resolved graph — `cargo tree -i <crate> --all-features --target all`
# prints nothing for either — so there is nothing to ignore and a genuinely new
# advisory in ANY dependency fails the gate.
#
# To add an ignore: cite the RUSTSEC id, prove the affected code is not
# compiled into the crate / wheel / tests (the `cargo tree -i` line), name the
# upstream condition that retires it, and mirror the entry in deny.toml.
ignore = []
