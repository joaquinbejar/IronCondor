# Release — build release-grade abi3 wheels + sdist on a version tag and, only
# after a manually-approved environment gate, publish them to PyPI via trusted
# publishing (OIDC, NO long-lived token). #41, docs/06 §7–§8,
# docs/RELEASE-PROCESS.md §5–§7, ADR-0005.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS WORKFLOW CANNOT PUBLISH BY ACCIDENT — the layered guards
# ─────────────────────────────────────────────────────────────────────────────
#   1. TAG-BOUND TRIGGER. It runs on `push: tags: ['v*']`, or on a MANUAL
#      DISPATCH that names an EXISTING tag (`workflow_dispatch` input `tag`,
#      added 2026-09-04 for RELEASE-PROCESS §7.1 recovery: the `v0.6.0` tag
#      run stranded its wheels on a retired runner label, and a tag-triggered
#      run reads this file AT THE TAG, so the only way to rebuild an already
#      published version with a fixed workflow is to run `main`'s definition
#      against the tag's sources). A branch push or a pull_request never
#      reach the publish job. The dispatch path is bound to the tag five ways
#      before any wheel is built (job `resolve-tag`): the input must be
#      `vX.Y.Z`; the tag must exist (checkout fails otherwise); the tag's
#      `Cargo.toml` version must equal it; the tag commit must be on `main`;
#      and every build job checks out THAT COMMIT (the sha `resolve-tag`
#      pinned), so the wheels carry the tag's sources and version, never
#      `main`'s and never a tag moved mid-run. The publish job re-asserts the
#      tag (push ref OR validated input) in its `if:` (defence in depth), and
#      guards 2–3 below apply unchanged on both paths.
#      LIMIT OF THE IN-FILE GUARDS ON THE DISPATCH PATH: a dispatch runs the
#      workflow file AT THE DISPATCHING REF, so a write-access user could
#      dispatch an edited copy from a branch. On that path the authoritative
#      gates are the ones GitHub enforces OUTSIDE this file: the `pypi`
#      environment's deployment policy (owner action: restrict it to `main`
#      and `v*` so no other ref can enter the environment or mint the OIDC
#      token) plus its required reviewers, and PyPI's trusted-publisher
#      registration (repo + workflow file name + environment). The checks in
#      this file are defence in depth there, not the perimeter.
#   2. ENVIRONMENT APPROVAL + REPO-VARIABLE KILL-SWITCH. `publish-pypi` runs in
#      the GitHub `pypi` environment AND its `if:` additionally requires the
#      repository variable `PYPI_PUBLISH_ENABLED == 'true'`. IMPORTANT: the
#      `environment:` key is only a real approval gate once the OWNER creates
#      the environment with REQUIRED REVIEWERS (Settings → Environments → pypi →
#      "Required reviewers"). A referenced-but-unconfigured environment is
#      AUTO-CREATED by GitHub with NO protection rules, so `environment:` alone
#      does NOT pause for a human. The `PYPI_PUBLISH_ENABLED` variable (unset by
#      default, settable only by a repo admin: Settings → Secrets and variables
#      → Actions → Variables) is the fail-closed complement — until BOTH the
#      variable is set AND a reviewer approves, the job never uploads. The
#      variable COMPLEMENTS, it does NOT replace, the required-reviewers action.
#   3. OIDC, NO TOKEN. Publishing uses `pypa/gh-action-pypi-publish` with
#      `permissions: id-token: write` and NO password/API token. It works ONLY
#      once the OWNER registers a PyPI "trusted publisher" for this repo +
#      workflow + environment (a one-time user-side step). Until then the upload
#      fails LOUDLY with a "no trusted publisher configured" error — it cannot
#      silently succeed, and there is no long-lived secret in CI to leak.
#   4. (RETIRED at 0.5.0) "Private :: Do Not Upload" classifier. Until the
#      first release the package carried this classifier, which PyPI rejects
#      on upload (HTTP 400), so nothing could publish by accident; the 0.5.0
#      release commit removed it once the name was registered.
#   5. (DISCHARGED at 0.5.0) UNREGISTERED NAME. `ironcondor` was not a PyPI
#      project before the owner registered it; since 0.5.0 (sdist + arm64
#      wheel on PyPI) it exists, so guards 1–3 are the live ones.
#
# Wired at #41; every publish is a deliberate, owner-approved event (CLAUDE.md,
# docs/06 §8). Never run `maturin publish` / twine against a live index from
# here.
#
# crates.io ↔ PyPI SEQUENCING (docs/RELEASE-PROCESS.md §6 → §7): a release
# publishes crates.io FIRST, then these PyPI wheels, both at the same X.Y.Z from
# the same tag. `cargo publish` is owner-gated too, so the crates.io step is a
# documented operator action (RELEASE-PROCESS.md §6) rather than a job here — see
# the commented `publish-crates` placeholder below the publish job.
#
# WINDOWS WHEELS: intentionally deferred (wishlist, docs/06 §7, PRD Q-6). The
# v0.4 matrix is Linux (manylinux) + macOS (x86_64 + arm64) only; adding Windows
# is a later evaluation, not an oversight.

name: release

on:
  push:
    tags:
      - "v*"
  # Recovery path (RELEASE-PROCESS §7.1): rebuild + publish an EXISTING tag
  # with the workflow definition on the dispatching ref (normally `main`).
  # Run as: gh workflow run release.yml --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (vX.Y.Z)"
        required: true
        type: string

# Least privilege at the top; the publish job re-grants `id-token: write` locally.
permissions:
  contents: read

concurrency:
  # A release is a DEPLOY: never cancel an in-flight build/publish for a tag
  # (unlike the non-deploy CI jobs, which set cancel-in-progress: true).
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The ONE tag this run builds and publishes: the dispatch input, or the
  # pushed tag. Every job checks out this ref and every version assertion
  # compares against it; nothing below reads `github.ref_name` directly.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # (0) Bind the run to one existing, version-matching tag on `main`. On the
  #     dispatch path it is the gate that turns a free-text input into a
  #     release identity; on the tag-push path it ADDS one constraint the push
  #     never guaranteed: the tag commit must already be on `main`, so a tag
  #     pushed before its release PR merges fails here instead of building
  #     (RELEASE-PROCESS §4–§5: merge first, tag the merge commit, then push
  #     the tag). Every other job `needs:` it.
  resolve-tag:
    name: resolve-tag (${{ inputs.tag || github.ref_name }})
    runs-on: ubuntu-24.04
    outputs:
      # The tag's commit, resolved ONCE here. The build jobs check out this
      # sha, not the tag name, so a tag moved between jobs, or a branch that
      # happens to share the tag's name, cannot change what gets built.
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Assert the tag is well-formed
        shell: bash
        run: |
          set -euo pipefail
          echo "release tag = ${RELEASE_TAG}"
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "'${RELEASE_TAG}' is not a vX.Y.Z release tag"; exit 1; }
      # A nonexistent tag fails HERE, loudly, before any build starts. The
      # ref is FULLY QUALIFIED (`refs/tags/…`): an unqualified name would let
      # a branch called `vX.Y.Z` shadow the tag. `fetch-depth: 0` brings every
      # branch and tag with full history, so `origin/main` is complete for the
      # ancestry check below (a second, shallow fetch would break that check
      # for a tag more than a few hundred commits behind main's tip).
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Assert the tag names the crate version and sits on main
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse HEAD)"
          echo "tag ${RELEASE_TAG} = ${TAG_SHA}"
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "crate version at ${RELEASE_TAG} = ${CRATE_VERSION}"
          test "${RELEASE_TAG}" = "v${CRATE_VERSION}" || {
            echo "tag ${RELEASE_TAG} != v${CRATE_VERSION} (Cargo.toml at the tag)"; exit 1; }
          # A release tag points at a merge commit on main (RELEASE-PROCESS
          # §4–§5); a dispatch naming a tag on a stray branch must not publish.
          git merge-base --is-ancestor "${TAG_SHA}" origin/main || {
            echo "tag ${RELEASE_TAG} (${TAG_SHA}) is not an ancestor of origin/main"; exit 1; }
          echo "sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"

  # ───────────────────────────────────────────────────────────────────────────
  # (a) Build release-grade abi3 wheels, one per platform target.
  #
  # Matrix rationale — SPLIT arch wheels, NOT universal2:
  #   - Linux x86_64  : manylinux (portable across glibc distros) via
  #                     maturin-action's `manylinux: auto` (builds in the
  #                     official manylinux container).
  #   - macOS x86_64  : native build on the Intel macos-15-intel runner.
  #   - macOS arm64   : native build on the Apple-silicon macos-15 runner.
  # Two NATIVE per-arch macOS wheels (not a single fat `universal2`) because:
  #   * pip selects the right wheel per architecture — no wasted bytes for users;
  #   * each wheel is ~half the size of a universal2 fat binary;
  #   * native builds avoid cross-compile / linker edge cases, and the spec asks
  #     for "macOS (x86_64 + arm64)" — two arch wheels map to that wording 1:1.
  # One `cp310-abi3` wheel per target (abi3-py310) serves Python 3.10+, so there
  # is NO per-minor build (docs/06 §7, ADR-0005 alt. 5).
  build-wheels:
    name: build-wheels (${{ matrix.target }} on ${{ matrix.runner }})
    needs: resolve-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # RUNNER LABELS (2026-09-04): GitHub retired the `macos-13` image on
      # 2025-12-04 and lists `macos-14` as deprecated (it keeps only the two
      # newest macOS versions). The `v0.6.0` tag run queued its x86_64 wheel on
      # `macos-13` indefinitely — no runner exists for that label any more — so
      # no wheel reached PyPI (#125). Intel wheels now build on `macos-15-intel`
      # and arm64 wheels on `macos-15`, both GA. When GitHub deprecates a label
      # here, the matrix is the ONLY place to move it: the tag-triggered run
      # reads the workflow file at the tag, so a stale label strands a release.
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
            manylinux: auto
          - runner: macos-15-intel
            target: x86_64
            manylinux: ""
          - runner: macos-15
            target: aarch64
            manylinux: ""
    steps:
      # The TAG's sources, on both trigger paths: the commit `resolve-tag`
      # pinned, never the tag name (see the `sha` output above). An empty
      # output would make checkout fall back to the default branch — a
      # fail-OPEN mode — so assert a full sha before checking out.
      - name: Assert the pinned commit
        shell: bash
        env:
          PINNED_SHA: ${{ needs.resolve-tag.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "${PINNED_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "resolve-tag produced no commit sha ('${PINNED_SHA}')"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.sha }}
      # abi3-py310 floor: build against 3.10 so the produced wheel is cp310-abi3.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Official maturin build action, PINNED to a full version (no floating
      # major). NOTE: this tag-triggered workflow is not exercised until the
      # owner pushes a `v*` tag, so bump/verify this pin (Dependabot can manage
      # it) as part of the first-release rehearsal.
      # `manylinux: auto` builds Linux wheels in the manylinux container; it is
      # empty on macOS (native build, no container). The wheel features mirror
      # python/pyproject.toml — `python orderbook simulator` (a self-contained
      # backtester); maturin merges these with the pyproject list so
      # `pyo3/extension-module` is still injected for the wheel link.
      - name: Build the cp310-abi3 wheel
        uses: PyO3/maturin-action@v1.49.3
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # reqwest 0.13's `rustls` feature pulls `aws-lc-sys` (C + assembly built
          # through cmake) into the `simulator` feature this wheel ships. The
          # manylinux container has no cmake, and its distro cmake would be too
          # old for aws-lc-sys anyway, so install a current one from PyPI inside
          # the container (a no-op for the macOS targets, which run natively on
          # runners that already carry cmake). Decision: CHANGELOG 2026-09-04.
          before-script-linux: pip install cmake
          working-directory: python
          # Comma-separated, unquoted: maturin-action splits `args` on
          # whitespace WITHOUT shell quoting, so a quoted space-separated
          # feature list leaks extra tokens to rustc as input filenames.
          args: --release --out dist --features python,orderbook,simulator
      # Version single-source guard (#41): every produced wheel filename must
      # carry the crate `[package].version`. maturin fills the wheel version from
      # the crate (dynamic version), so a mismatch means the wiring broke — fail
      # BEFORE anything can be published.
      - name: Assert wheel filenames carry the crate version
        shell: bash
        run: |
          set -euo pipefail
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "crate version = ${CRATE_VERSION}"
          # One tag drives one X.Y.Z (RELEASE-PROCESS §2/§4): the release tag
          # (pushed, or the validated dispatch input) must equal v<crate
          # version>, else a mis-tag (e.g. v9.9.9 over a 0.0.1 Cargo.toml)
          # would ship wheels whose version contradicts the tag. Fails the
          # build long before any publish.
          test "${RELEASE_TAG}" = "v${CRATE_VERSION}" || {
            echo "tag ${RELEASE_TAG} != v${CRATE_VERSION} (Cargo.toml)"; exit 1; }
          shopt -s nullglob
          found=0
          for whl in python/dist/*.whl; do
            found=1
            base="$(basename "${whl}")"
            echo "built wheel  = ${base}"
            case "${base}" in
              ironcondor-"${CRATE_VERSION}"-*) : ;;
              *) echo "wheel filename version != crate version ${CRATE_VERSION}"; exit 1 ;;
            esac
          done
          test "${found}" = 1 || { echo "no wheel produced in python/dist/"; exit 1; }
      - name: Upload the wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # (a′) Build the source distribution (sdist) — one, platform-independent.
  build-sdist:
    name: build-sdist
    needs: resolve-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Assert the pinned commit
        shell: bash
        env:
          PINNED_SHA: ${{ needs.resolve-tag.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "${PINNED_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "resolve-tag produced no commit sha ('${PINNED_SHA}')"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.sha }}
      - name: Build the sdist
        uses: PyO3/maturin-action@v1.49.3
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - name: Upload the sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # (b) Publish to PyPI via trusted publishing (OIDC). GATED five ways:
  #     tag-bound trigger (pushed tag, or a dispatch input validated by
  #     `resolve-tag`) + `if` guard (tag ref OR validated input, AND the
  #     `PYPI_PUBLISH_ENABLED` repo-variable kill-switch) + `environment: pypi`
  #     required reviewers + OIDC-no-token (needs the owner's trusted-publisher
  #     registration).
  #     (The former "Private :: Do Not Upload" classifier guard was retired at 0.5.0.)
  publish-pypi:
    name: publish-pypi
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    # Fail-closed gate: a release tag (the pushed ref, or the dispatch input
    # that `resolve-tag` already bound to an existing, version-matching tag on
    # main — `needs:` above makes that job's success a precondition) AND the
    # repo-variable kill-switch. `environment: pypi` is NOT a
    # sufficient approval gate on its own — a referenced-but-unconfigured
    # environment is auto-created with no protection rules — so the publish path
    # additionally requires `vars.PYPI_PUBLISH_ENABLED == 'true'`, a repository
    # variable only a repo admin can set (unset by default). It COMPLEMENTS, it
    # does NOT replace, the required-reviewers user action described below.
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v'))
      && vars.PYPI_PUBLISH_ENABLED == 'true'
    # The USER-SIDE approval gate: this environment enforces a human pause ONLY
    # once the owner configures it with REQUIRED REVIEWERS (Settings →
    # Environments → pypi). Unconfigured, GitHub auto-creates it with no
    # protection, so the `PYPI_PUBLISH_ENABLED` variable in the `if:` above is
    # the complementary fail-closed switch, not this key alone.
    environment:
      name: pypi
      url: https://pypi.org/project/ironcondor/
    # OIDC only — NO API token / password anywhere. `id-token: write` lets the
    # runner mint the short-lived OIDC token PyPI trusted publishing exchanges.
    permissions:
      id-token: write
    steps:
      - name: Download all wheel + sdist artifacts into dist/
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List the release artifacts
        run: ls -l dist
      # Trusted publishing (OIDC). NO `password:` input → the action uses the
      # OIDC token, which works ONLY once the owner has registered a PyPI trusted
      # publisher for repo `joaquinbejar/IronCondor`, workflow `release.yml`,
      # environment `pypi`. Until then this step FAILS with a clear
      # "trusted publisher not configured" error — it never silently no-ops.
      # Pinned to a full version (recommended for OIDC publishing).
      - name: Publish to PyPI (trusted publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages-dir: dist
          print-hash: true

  # ───────────────────────────────────────────────────────────────────────────
  # (c) crates.io publish — DOCUMENTED PLACEHOLDER (sequencing note).
  #
  # RELEASE-PROCESS.md §6 → §7: crates.io publishes FIRST, then the PyPI wheels
  # above, both at the same X.Y.Z. `cargo publish` is owner-gated (it needs
  # CARGO_REGISTRY_TOKEN and a deliberate approval), and the release playbook has
  # the OPERATOR run it (§6), so it is intentionally NOT wired as a live job here
  # — mirroring the "never publish without approval" rule that also governs PyPI.
  #
  # If it is ever wired, it belongs here, BEFORE `publish-pypi` in the graph, and
  # behind its OWN approval gate (e.g. `environment: crates-io`):
  #
  #   publish-crates:
  #     name: publish-crates
  #     runs-on: ubuntu-24.04
  #     if: startsWith(github.ref, 'refs/tags/v')
  #     environment: crates-io          # second user-side manual-approval gate
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: dtolnay/rust-toolchain@1.97.0
  #       - run: cargo publish            # uses CARGO_REGISTRY_TOKEN; owner-gated
  #
  # …and `publish-pypi` would then `needs: [build-wheels, build-sdist,
  # publish-crates]` to enforce the crates-first ordering. Left commented so this
  # workflow cannot publish to crates.io by accident.
