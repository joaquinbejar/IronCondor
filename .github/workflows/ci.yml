name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      # `--all-features` compiles the `python` feature (#38): pyo3-build-config
      # needs an interpreter >= the abi3-py310 floor. setup-python pins it
      # instead of trusting the runner image's system python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      # `--all-features` builds pyo3 WITHOUT extension-module (that flag is
      # maturin-injected, #38), so the test binaries link libpython in
      # embedding mode — setup-python provides a shared libpython >= 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  golden:
    name: golden
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test golden

  zero-alloc:
    name: zero-alloc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # PB-1 hard invariant gate: per-step replay-loop allocations must not grow
      # with step count. A non-zero warmup(K)->last delta fails the build.
      # Distinct from the throughput bench (#18) and the golden job (#17).
      - run: cargo test --test zero_alloc

  bench-gate:
    name: bench-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # PB-3 regression gate (#29, docs/07 §6, docs/TESTING.md §11.1). Runs the
      # realistic-vs-naive A/B bench (`benches/realistic_overhead.rs`) with
      # REDUCED criterion samples (short job — full-fidelity numbers are the
      # local BENCH.md measurement) and fails the build if the DIMENSIONLESS
      # realistic/naive overhead RATIO leaves its committed band.
      #
      # Why the ratio, not an absolute number: the BENCH.md baseline is Apple
      # M4 Max but this runner is Linux — an absolute-ns compare would false-
      # positive every run. The ratio is HARDWARE-PORTABLE: both modes run the
      # same `run_backtest` over the same tape in the same process, so a uniform
      # clock-speed factor cancels and the ratio only moves on a real
      # algorithmic regression in one mode (a naive regression drops it toward 1
      # → trips the floor; a realistic blow-up raises it → trips the ceiling).
      # A coarse absolute naive ceiling is a documented backstop for the one
      # case the ratio is blind to (a regression that slows BOTH modes equally).
      # Distinct from the zero-alloc gate (PB-1) and the throughput bench (PB-2).
      - run: ./scripts/bench_gate.sh

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Adversarial-input suite (docs/TESTING.md §12.1, docs/07 §8): every
      # malformed Parquet fixture must yield a typed BacktestError with a
      # bounded resource ceiling — never a panic, hang, or OOM. The fixtures
      # are committed permanent regressions. Distinct from
      # test/golden/zero-alloc/audit/deny.
      - run: cargo test --test security

  build-release:
    name: build-release
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # RUSTSEC advisory gate, green from v0.1 (docs/07 §10,
      # docs/TESTING.md §12.4). Pinned tool version installed from source with
      # `--locked` (no third-party install action added in the supply-chain PR
      # itself). `--deny warnings` fails the build on ANY advisory — a
      # vulnerability OR an unmaintained/unsound warning; the single documented
      # ignore (RUSTSEC-2024-0436, paste unmaintained) lives in
      # `.cargo/audit.toml`, auto-read from the repo root.
      - run: cargo install --locked --version 0.22.1 cargo-audit
      - run: cargo audit --deny warnings

  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Licence / bans / sources / advisories gate (`deny.toml`), green from
      # v0.1. A disallowed licence, a banned or unknown source, or a NEW RUSTSEC
      # advisory fails the build; only the documented paste ignore in deny.toml
      # is exempt. `Cargo.lock` is committed and pins the exact audited tree
      # (its sha256 becomes `lockfile_sha256` build provenance in the v0.3
      # bundle manifest, docs/07 §10).
      - run: cargo install --locked --version 0.19.2 cargo-deny
      # `--all-features` resolves the FULL feature graph (python/orderbook/
      # simulator) so feature-gated dependencies are licence/advisory-gated
      # too — the default-features graph silently skipped them until #38
      # exposed it (target-lexicon's `Apache-2.0 WITH LLVM-exception` and the
      # simulator's rustls stack were never checked).
      - run: cargo deny --all-features check

  python-wheels:
    name: python-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Python 3.10 == the abi3 floor, so maturin builds a `cp310-abi3` wheel
      # with no forward-compatibility shim. One wheel per platform serves 3.10+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # pandas + pyarrow are the optional `ironcondor[pandas]` extra the Bundle
      # DataFrame accessors need; installed from the index (the wheel below is
      # installed --no-index, so its optional deps are staged here first).
      - name: Install maturin + pytest + the pandas extra
        run: python -m pip install --upgrade "maturin>=1.7,<2.0" pytest pandas pyarrow numpy
      # Builds the wheel from `python/pyproject.toml` (manifest-path points at the
      # root crate). `--features "python orderbook simulator"` mirrors the
      # pyproject `[tool.maturin] features` — the PUBLISHED wheel is a
      # self-contained backtester: naive + realistic execution (`orderbook`) AND
      # the synthetic-chain feed (`simulator`), docs/06 §7. maturin MERGES these
      # CLI features with the pyproject list, so `pyo3/extension-module` (injected
      # there for the wheel link) is still present. `simulator` adds no new
      # lockfile entry / licence (its rustls stack is already allow-listed in
      # deny.toml). --out keeps the wheel next to the project for install. This PR
      # job builds the SAME feature set the release wheels ship, so a break shows
      # up on every pipeline, not only on a tag.
      - name: Build the cp310-abi3 wheel
        working-directory: python
        run: maturin build --release --features "python orderbook simulator" --out dist
      # Version single-source guard (#41, extends the #38 __version__ check): the
      # wheel FILENAME must carry the crate `[package].version`, so the packaging
      # metadata (not just the runtime `__version__`) is proven to track the one
      # Cargo.toml string. maturin fills the wheel version from the crate, so a
      # drift here means the dynamic-version wiring broke.
      - name: Assert the built wheel filename carries the crate version
        run: |
          set -euo pipefail
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "crate version = ${CRATE_VERSION}"
          shopt -s nullglob
          found=0
          for whl in python/dist/*.whl; do
            found=1
            base="$(basename "${whl}")"
            echo "built wheel  = ${base}"
            case "${base}" in
              ironcondor-"${CRATE_VERSION}"-*) : ;;
              *) echo "wheel filename version != crate version ${CRATE_VERSION}"; exit 1 ;;
            esac
          done
          test "${found}" = 1 || { echo "no wheel produced in python/dist/"; exit 1; }
      - name: Install the built wheel
        working-directory: python
        run: python -m pip install --no-index --find-links dist ironcondor
      # Acceptance criterion (#38): the wheel imports and reports the crate
      # version. Compares the module's `__version__` against the crate version
      # parsed from Cargo.toml — a byte match, no hand-copied string.
      - name: Smoke-import and assert __version__ == crate version
        run: |
          set -euo pipefail
          MODULE_VERSION="$(python -c 'import ironcondor; print(ironcondor.__version__)')"
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "ironcondor.__version__ = ${MODULE_VERSION}"
          echo "crate version         = ${CRATE_VERSION}"
          test "${MODULE_VERSION}" = "${CRATE_VERSION}"
      - name: Run the pytest smoke suite
        run: python -m pytest python/tests -q
