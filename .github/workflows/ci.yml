name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      # `--all-features` compiles the `python` feature (#38): pyo3-build-config
      # needs an interpreter >= the abi3-py310 floor. setup-python pins it
      # instead of trusting the runner image's system python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      # `--all-features` builds pyo3 WITHOUT extension-module (that flag is
      # maturin-injected, #38), so the test binaries link libpython in
      # embedding mode — setup-python provides a shared libpython >= 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  golden:
    name: golden
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # The determinism golden suite (#17, #36, #50). `--test golden` is the
      # v0.1 equity-curve + minimal-metrics goldens; `--test bundle_golden` is
      # the frozen four-table + manifest bundle goldens for every named scenario
      # (iron_condor_naive / short_strangle_naive / iron_condor_realistic) under
      # the single comparison oracle + the run-twice byte-identical assertion.
      # The `orderbook` runs add the realistic-mode goldens (naive-only feature
      # sets skip them, #[cfg(feature = "orderbook")]); `orderbook` needs no
      # Python interpreter, so this job stays on the bare toolchain.
      - run: cargo test --test golden
      - run: cargo test --test golden --features orderbook
      - run: cargo test --test bundle_golden
      - run: cargo test --test bundle_golden --features orderbook

  surface:
    name: surface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # SemVer surface-freeze gate (#49, docs/SEMVER.md §"Surface-freeze gates").
      # Diffs the `src/lib.rs` re-export surface against the committed snapshot
      # `tests/surface/rust-public-api.txt`, pins the config env-var set
      # (`API_URL`), and pins the `BacktestConfig` serialized field set. A
      # re-export add/remove/rename, a new runtime env var, or a config-field
      # change fails here unless the committed snapshot / pinned list is
      # regenerated in the SAME PR (`BLESS=1 cargo test --test surface`) — the
      # visible SemVer event. Stable-toolchain only: no nightly rustdoc-JSON
      # dependency, so the freeze never breaks on nightly format churn (unlike
      # cargo-public-api / cargo-semver-checks; rationale in docs/SEMVER.md).
      # The bundle surface is gated by `golden` + `test` (#36 goldens); the
      # Python surface by `python-wheels` (runtime-names step below).
      - run: cargo test --test surface
      - run: cargo test --lib test_config_serialized_field_set_is_pinned

  zero-alloc:
    name: zero-alloc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # PB-1 hard invariant gate: per-step replay-loop allocations must not grow
      # with step count. A non-zero warmup(K)->last delta fails the build.
      # Distinct from the throughput bench (#18) and the golden job (#17).
      - run: cargo test --test zero_alloc

  bench-gate:
    name: bench-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      # The H5 PyO3 gate builds the `python` feature, which links libpython in
      # embedding mode (pyo3 WITHOUT extension-module, #38), so it needs a shared
      # libpython >= the abi3-py310 floor. The H1/H2 ratio and H3/H4 linearity
      # gates need no interpreter.
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      # --------------------------------------------------------------------
      # The v1.0 hot-path regression gates (#51, docs/07 §6, docs/TESTING.md
      # §11.1) — one gate per tracked hot path H1–H5 against its BENCH.md
      # baseline. EVERY gate is baseline-RELATIVE: it compares a DIMENSIONLESS
      # within-run ratio against a committed band, NOT an absolute nanosecond
      # count, because the BENCH.md baselines are Apple M4 Max while this runner
      # is Linux — an absolute compare would false-positive every run. A uniform
      # clock-speed factor cancels in every gated ratio.
      #
      # HONEST SCOPE: the H3/H4/H5 gates catch a super-linear / disproportionate
      # SHAPE regression, NOT a magnitude one — a uniform constant-factor slowdown
      # that preserves the ratio passes silently (that case is the H1/H2 coarse
      # naive backstop's job, below). "One gate per hot path" means each path has
      # a baseline gate, not that every regression on it is caught. The SOLE
      # documented absolute number is the #29 coarse naive ceiling inside
      # bench_gate.sh — a catastrophic-only backstop, never approached on CI
      # hardware. A shortened --measurement-time keeps the stage short (the
      # linearity benches fix their own sample count programmatically, so a
      # --sample-size flag would be dead); full-fidelity numbers are the local
      # BENCH.md entries.
      # --------------------------------------------------------------------
      # H1 replay loop + H2 fill models (#29): the realistic/naive overhead ratio
      # band [18x, 72x]. A naive regression drops the ratio toward 1 (trips the
      # floor — the naive-throughput protection); a realistic blow-up raises it
      # (trips the ceiling). Plus the coarse absolute naive backstop.
      - name: "H1+H2 — naive-throughput / realistic-overhead ratio gate"
        run: ./scripts/bench_gate.sh
      # H3 conversion + H4 bundle writer: the LINEARITY gates. The per-contract
      # (conversion) and per-row (writer) within-run cost ratios must stay under
      # their committed shape ceilings, so a super-linear O(n^2) regression fails.
      # Dimensionless, so hardware-portable.
      - name: "H3+H4 — conversion / bundle-writer linearity gate"
        run: ./scripts/linearity_gate.sh
      # H5 PyO3 boundary: the full-config / single-crossing marshal ratio band
      # [8x, 32x]. A regression in the config/strategy marshal path relative to
      # the trivial crossing floor fails. PYO3_PYTHON pins the interpreter
      # setup-python provisioned.
      - name: "H5 — PyO3 boundary marshal-ratio gate"
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: ./scripts/pyo3_gate.sh
      # PB-1 zero-alloc REAFFIRMATION (reference, NOT reimplemented). The
      # canonical hard gate is the separate `zero-alloc` job above; this re-runs
      # the SAME `tests/zero_alloc.rs` invariant inside the perf-gate stage so the
      # zero-steady-state-allocation guarantee is reaffirmed alongside the
      # percentile/linearity gates (#51 acceptance criterion). A non-zero per-step
      # allocation delta fails here too.
      - name: "PB-1 — zero-alloc replay-loop gate (reaffirmation)"
        run: cargo test --test zero_alloc

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Adversarial-input suite (docs/TESTING.md §12.1, docs/07 §8): every
      # malformed Parquet fixture must yield a typed BacktestError with a
      # bounded resource ceiling — never a panic, hang, or OOM. The fixtures
      # are committed permanent regressions. Distinct from
      # test/golden/zero-alloc/audit/deny.
      - run: cargo test --test security

  build-release:
    name: build-release
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # RUSTSEC advisory gate, green from v0.1 (docs/07 §10,
      # docs/TESTING.md §12.4). Pinned tool version installed from source with
      # `--locked` (no third-party install action added in the supply-chain PR
      # itself). `--deny warnings` fails the build on ANY advisory — a
      # vulnerability OR an unmaintained/unsound warning; the single documented
      # ignore (RUSTSEC-2024-0436, paste unmaintained) lives in
      # `.cargo/audit.toml`, auto-read from the repo root.
      - run: cargo install --locked --version 0.22.1 cargo-audit
      - run: cargo audit --deny warnings

  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Licence / bans / sources / advisories gate (`deny.toml`), green from
      # v0.1. A disallowed licence, a banned or unknown source, or a NEW RUSTSEC
      # advisory fails the build; only the documented paste ignore in deny.toml
      # is exempt. `Cargo.lock` is committed and pins the exact audited tree
      # (its sha256 becomes `lockfile_sha256` build provenance in the v0.3
      # bundle manifest, docs/07 §10).
      - run: cargo install --locked --version 0.19.2 cargo-deny
      # `--all-features` resolves the FULL feature graph (python/orderbook/
      # simulator) so feature-gated dependencies are licence/advisory-gated
      # too — the default-features graph silently skipped them until #38
      # exposed it (target-lexicon's `Apache-2.0 WITH LLVM-exception` and the
      # simulator's rustls stack were never checked).
      - run: cargo deny --all-features check

  python-wheels:
    name: python-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Python 3.10 == the abi3 floor, so maturin builds a `cp310-abi3` wheel
      # with no forward-compatibility shim. One wheel per platform serves 3.10+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # pandas + pyarrow are the optional `ironcondor[pandas]` extra the Bundle
      # DataFrame accessors need; installed from the index (the wheel below is
      # installed --no-index, so its optional deps are staged here first).
      - name: Install maturin + pytest + the pandas extra
        run: python -m pip install --upgrade "maturin>=1.7,<2.0" pytest pandas pyarrow numpy
      # Builds the wheel from `python/pyproject.toml` (manifest-path points at the
      # root crate). `--features "python orderbook simulator"` mirrors the
      # pyproject `[tool.maturin] features` — the PUBLISHED wheel is a
      # self-contained backtester: naive + realistic execution (`orderbook`) AND
      # the synthetic-chain feed (`simulator`), docs/06 §7. maturin MERGES these
      # CLI features with the pyproject list, so `pyo3/extension-module` (injected
      # there for the wheel link) is still present. `simulator` adds no new
      # lockfile entry / licence (its rustls stack is already allow-listed in
      # deny.toml). --out keeps the wheel next to the project for install. This PR
      # job builds the SAME feature set the release wheels ship, so a break shows
      # up on every pipeline, not only on a tag.
      - name: Build the cp310-abi3 wheel
        working-directory: python
        run: maturin build --release --features "python orderbook simulator" --out dist
      # Version single-source guard (#41, extends the #38 __version__ check): the
      # wheel FILENAME must carry the crate `[package].version`, so the packaging
      # metadata (not just the runtime `__version__`) is proven to track the one
      # Cargo.toml string. maturin fills the wheel version from the crate, so a
      # drift here means the dynamic-version wiring broke.
      - name: Assert the built wheel filename carries the crate version
        run: |
          set -euo pipefail
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "crate version = ${CRATE_VERSION}"
          shopt -s nullglob
          found=0
          for whl in python/dist/*.whl; do
            found=1
            base="$(basename "${whl}")"
            echo "built wheel  = ${base}"
            case "${base}" in
              ironcondor-"${CRATE_VERSION}"-*) : ;;
              *) echo "wheel filename version != crate version ${CRATE_VERSION}"; exit 1 ;;
            esac
          done
          test "${found}" = 1 || { echo "no wheel produced in python/dist/"; exit 1; }
      - name: Install the built wheel
        working-directory: python
        run: python -m pip install --no-index --find-links dist ironcondor
      # Acceptance criterion (#38): the wheel imports and reports the crate
      # version. Compares the module's `__version__` against the crate version
      # parsed from Cargo.toml — a byte match, no hand-copied string.
      - name: Smoke-import and assert __version__ == crate version
        run: |
          set -euo pipefail
          MODULE_VERSION="$(python -c 'import ironcondor; print(ironcondor.__version__)')"
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "ironcondor.__version__ = ${MODULE_VERSION}"
          echo "crate version         = ${CRATE_VERSION}"
          test "${MODULE_VERSION}" = "${CRATE_VERSION}"
      # PyO3 surface-freeze gate (#49, docs/SEMVER.md §"Surface-freeze gates").
      # The runtime-names comparison against the built wheel: `dir(ironcondor)`
      # minus the Python-injected module dunders MUST equal the committed
      # `python/tests/expected_public_names.txt`. A `#[pymodule]` name added or
      # removed in `src/python/*` fails here unless the frozen list is updated in
      # the same PR — the visible SemVer event. `python/ironcondor.pyi` is the
      # human-readable snapshot of the same surface. (`test_surface.py` in the
      # pytest step below runs the identical check for local/dev feedback.)
      - name: Assert the PyO3 surface matches the frozen name list (#49)
        run: |
          set -euo pipefail
          python - <<'PY'
          import types
          from pathlib import Path
          import ironcondor

          # Python/packaging-injected module dunders + the maturin mixed-layout
          # `ironcondor` submodule self-reference (a packaging artifact, excluded
          # by dropping every submodule attribute) are not part of the surface.
          auto = {
              "__name__", "__doc__", "__package__", "__loader__", "__spec__",
              "__file__", "__builtins__", "__path__", "__all__", "__dict__",
              "__cached__",
          }
          exposed = {
              name for name in dir(ironcondor)
              if name not in auto
              and not isinstance(getattr(ironcondor, name, None), types.ModuleType)
          }
          expected = {
              line.strip()
              for line in Path("python/tests/expected_public_names.txt")
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          }
          if exposed != expected:
              missing = sorted(expected - exposed)
              added = sorted(exposed - expected)
              raise SystemExit(
                  f"PyO3 surface drift: missing={missing} added={added}; update "
                  "python/tests/expected_public_names.txt and record the SemVer event"
              )
          print(f"PyO3 surface OK: {len(expected)} frozen names")
          PY
      - name: Run the pytest smoke suite
        run: python -m pytest python/tests -q
