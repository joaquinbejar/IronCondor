name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  golden:
    name: golden
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test golden

  zero-alloc:
    name: zero-alloc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # PB-1 hard invariant gate: per-step replay-loop allocations must not grow
      # with step count. A non-zero warmup(K)->last delta fails the build.
      # Distinct from the throughput bench (#18) and the golden job (#17).
      - run: cargo test --test zero_alloc

  bench-gate:
    name: bench-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # PB-3 regression gate (#29, docs/07 §6, docs/TESTING.md §11.1). Runs the
      # realistic-vs-naive A/B bench (`benches/realistic_overhead.rs`) with
      # REDUCED criterion samples (short job — full-fidelity numbers are the
      # local BENCH.md measurement) and fails the build if the DIMENSIONLESS
      # realistic/naive overhead RATIO leaves its committed band.
      #
      # Why the ratio, not an absolute number: the BENCH.md baseline is Apple
      # M4 Max but this runner is Linux — an absolute-ns compare would false-
      # positive every run. The ratio is HARDWARE-PORTABLE: both modes run the
      # same `run_backtest` over the same tape in the same process, so a uniform
      # clock-speed factor cancels and the ratio only moves on a real
      # algorithmic regression in one mode (a naive regression drops it toward 1
      # → trips the floor; a realistic blow-up raises it → trips the ceiling).
      # A coarse absolute naive ceiling is a documented backstop for the one
      # case the ratio is blind to (a regression that slows BOTH modes equally).
      # Distinct from the zero-alloc gate (PB-1) and the throughput bench (PB-2).
      - run: ./scripts/bench_gate.sh

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Adversarial-input suite (docs/TESTING.md §12.1, docs/07 §8): every
      # malformed Parquet fixture must yield a typed BacktestError with a
      # bounded resource ceiling — never a panic, hang, or OOM. The fixtures
      # are committed permanent regressions. Distinct from
      # test/golden/zero-alloc/audit/deny.
      - run: cargo test --test security

  build-release:
    name: build-release
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # RUSTSEC advisory gate, green from v0.1 (docs/07 §10,
      # docs/TESTING.md §12.4). Pinned tool version installed from source with
      # `--locked` (no third-party install action added in the supply-chain PR
      # itself). `--deny warnings` fails the build on ANY advisory — a
      # vulnerability OR an unmaintained/unsound warning; the single documented
      # ignore (RUSTSEC-2024-0436, paste unmaintained) lives in
      # `.cargo/audit.toml`, auto-read from the repo root.
      - run: cargo install --locked --version 0.22.1 cargo-audit
      - run: cargo audit --deny warnings

  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Licence / bans / sources / advisories gate (`deny.toml`), green from
      # v0.1. A disallowed licence, a banned or unknown source, or a NEW RUSTSEC
      # advisory fails the build; only the documented paste ignore in deny.toml
      # is exempt. `Cargo.lock` is committed and pins the exact audited tree
      # (its sha256 becomes `lockfile_sha256` build provenance in the v0.3
      # bundle manifest, docs/07 §10).
      - run: cargo install --locked --version 0.19.2 cargo-deny
      - run: cargo deny check
