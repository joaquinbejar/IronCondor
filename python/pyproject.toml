# maturin packaging for the `ironcondor` Python extension (#38, ADR-0005,
# docs/06 §7). Builds a single `cp310-abi3` wheel per platform from the root
# crate's `python` feature. Publication to PyPI was owner-approved at the
# 0.5.0 release (the former `Private :: Do Not Upload` hard guard was removed
# with that approval, per the #41 first-release protocol).

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ironcondor"
description = "High-performance options-strategy backtester with order-book-level fill simulation (Python bindings)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joaquin Bejar", email = "jb@taunais.com" }]
keywords = ["finance", "options", "trading", "backtesting", "quant"]
# maturin fills the version from the crate (Cargo.toml `version`), so the
# wheel version and the crate version are always one string.
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
# The `Bundle` DataFrame accessors call `pandas.read_parquet` on demand, so
# pandas (+ its pyarrow engine) is an OPTIONAL soft dependency, not a hard wheel
# requirement: `run()` / `load_bundle` / `metrics()` work without it, and a
# missing pandas raises a clear ImportError naming this extra (docs/06 §6). The
# bundle is plain Parquet + JSON, so polars / pyarrow can read `bundle.path`
# directly instead.
pandas = ["pandas>=1.5", "pyarrow>=10"]

[project.urls]
Homepage = "https://github.com/joaquinbejar/IronCondor"
Repository = "https://github.com/joaquinbejar/IronCondor"

[tool.maturin]
# The crate manifest lives at the repository root, one level up.
manifest-path = "../Cargo.toml"
# Enable the binding code (`python`) plus the execution + feed features that make
# the PUBLISHED wheel a self-contained backtester (docs/06 §7, the architect
# follow-up from the #38 re-validation), plus `pyo3/extension-module` for the
# wheel build ONLY:
#   - `orderbook`  — realistic execution via option-chain-orderbook, so
#                    `execution_realistic` genuinely runs in the wheel, not a stub.
#   - `simulator`  — the OptionChain-Simulator synthetic-chain feed, so the wheel
#                    is a self-contained backtester (feeds included), not just a
#                    file-fed one. It pulls reqwest/tokio (rustls TLS), but every
#                    licence in that stack is ALREADY on the `deny.toml`
#                    allow-list (ISC / CDLA-Permissive-2.0 / BSD — see the #38
#                    audit notes there) and already resolved in `Cargo.lock`, so
#                    it adds NO new lockfile entry and NO new licence: the
#                    `lockfile_sha256` build identity and the goldens are
#                    unaffected, and `cargo deny --all-features check` stays green.
#   - `pyo3/extension-module` — suppresses the libpython link (correct for the
#                    importable cdylib). Kept OUT of the `python` cargo feature so
#                    `cargo test --all-features` still links and runs (see
#                    Cargo.toml); maturin injects it here for the wheel build only.
#                    maturin MERGES these with any `--features` passed on the CLI,
#                    so the CI build args (`python orderbook simulator`) union with
#                    this list — extension-module is always present in the wheel.
# abi3 is inferred from the crate's `pyo3` `abi3-py310` feature → a `cp310-abi3`
# wheel.
features = ["python", "orderbook", "simulator", "pyo3/extension-module"]
# The importable module name; matches the crate `[lib] name` and the
# `#[pymodule] fn ironcondor` entry point.
module-name = "ironcondor"
# Ship the type stub and PEP 561 marker from this directory.
include = ["ironcondor.pyi", "py.typed"]
strip = true
