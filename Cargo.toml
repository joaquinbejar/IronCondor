[package]
name = "ironcondor"
version = "0.0.1"
edition = "2024"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "High-performance backtesting engine for options trading strategies with order-book-level fill simulation. Built on OptionStratLib."
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/IronCondor"
homepage = "https://github.com/joaquinbejar/IronCondor"
keywords = ["finance", "options", "trading", "backtesting", "quant"]
categories = ["finance", "simulation"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "ironcondor"
path = "src/lib.rs"
# Declared unconditionally — Cargo cannot toggle crate-type by feature.
# Without the `python` feature the cdylib links no PyO3 and is inert.
crate-type = ["rlib", "cdylib"]

[features]
# default — engine + naive execution + historical feeds.
default = []
# orderbook — realistic execution via option-chain-orderbook (v0.2, #22).
# Pulls the matching engine + the optionstratlib 0.17 boundary shim (see the
# `[dependencies]` audit notes). Absent from the default build.
orderbook = ["dep:option-chain-orderbook", "dep:optionstratlib_ob"]
# simulator — synthetic chain sessions via OptionChain-Simulator over HTTP.
# Pulls the async transport (reqwest) + a minimal tokio runtime; NONE of these
# compile in the default build. (serde_json is now a core dependency — the
# bundle manifest + run_id derivation need it in every build — so it is no
# longer feature-gated here.)
simulator = ["dep:reqwest", "dep:tokio"]
# python — PyO3 bindings built with maturin (#38, ADR-0005). Gates the PyO3
# DEPENDENCY + the `#[pymodule]` code, NOT the crate-type: Cargo resolves
# `[lib] crate-type` before feature unification, so it cannot be toggled by a
# feature (see the `[lib]` note above). Off by default → the default /
# crates.io build carries ZERO Python dependencies. Deliberately does NOT pull
# `pyo3/extension-module`: that feature suppresses the libpython link, which is
# correct for the importable cdylib but breaks the `cargo test` / `--all-features`
# executable link (an executable cannot defer the `Py*` symbols a cdylib
# resolves at import). maturin injects `pyo3/extension-module` for the wheel
# build only (see `python/pyproject.toml`), so `cargo test --all-features`
# stays green.
python = ["dep:pyo3"]

[dependencies]
chrono = "0.4"
optionstratlib = { version = "0.18", default-features = false }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Columnar stack for the Parquet historical feed (the default v0.1 release
# feed) and, later, the result-bundle writer (#34, ADR-0004) — one stack,
# read and write. `default-features = false` drops parquet's async path
# (tokio/futures); `arrow` enables the record-batch reader, `snap` the
# ubiquitous Snappy page codec. Licence: Apache-2.0.
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
# CSV historical feed parser (#27, v0.2 breadth) — a streaming, bounded record
# reader for the integer-cents per-step chain files. Audit note: what — the CSV
# parser behind the default-feature `CsvFeed`; why — the CSV feed is v0.2
# breadth on the v0.1 slice; licence — Unlicense OR MIT (resolves to MIT on the
# `deny.toml` allow-list). Already present transitively via optionstratlib, so
# this direct dependency adds nothing new to the lockfile; `cargo audit` /
# `cargo deny` stay green.
csv = "1"
# Streaming file sha256 = the tape data-identity for file feeds. Licence:
# MIT OR Apache-2.0.
sha2 = "0.10"
# Structured logging — the repo-mandated logging crate (`rules/global_rules.md`
# "Logging & Observability"; docs/05 §13 "tracing on write milestones"). Used by
# the P&L attribution (#31) to emit the advisory `WARN` when a step's residual
# exceeds the documented model-quality threshold — never a run failure, never a
# change to the bundle bytes. Audit note: what — the `tracing` facade behind the
# advisory attribution warning; why — the mandated logger, required by the
# milestone acceptance criteria; licence — MIT. Already present transitively (via
# optionstratlib, reqwest, …) at the same 0.1.x, so this direct dependency adds
# nothing new to the lockfile; `cargo audit` / `cargo deny` stay green.
tracing = "0.1"
# Seeded ChaCha8Rng — the run's SOLE randomness source (docs/02 §7); seeded
# from config.seed so `(seed, config, data)` is byte-reproducible. Never
# `thread_rng`. `ChaCha8Rng` + its re-exported `rand_core::SeedableRng` are the
# only surface used; no `rand` facade is pulled. Licence: MIT OR Apache-2.0.
rand_chacha = { version = "0.3", default-features = false }
# simulator feed transport — feature-gated, absent from the default build.
# reqwest: pure-Rust rustls TLS (no system OpenSSL, reproducible CI) + json.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
# tokio: only the pieces the async client + its test harness need.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
], optional = true }
# serde_json — a core (non-optional) dependency from v0.3: the result-bundle
# `manifest.json` is JSON, and the `run_id` derivation hashes a canonical-JSON
# preimage of the semantic config + strategy + build identity (src/bundle/schema.rs).
# The simulator feed also uses it for the tagged `method`/`parameters` raw-JSON
# wire fields. Audit note: what — the serde JSON codec behind the bundle manifest
# and run_id; why — the bundle is a core artifact, not feature-gated; licence —
# MIT OR Apache-2.0. Already in the lockfile (dev-dep + prior optional dep), so
# promoting it to non-optional adds no new crate; `cargo audit` / `cargo deny`
# stay green.
serde_json = "1"
# realistic-fill matching engine — feature `orderbook` only, absent from the
# default build (#22, ADR-0002). `default-features = false` disables its `nats`
# (async-nats/tokio) and `sequencer` (tokio/journal) optional stacks, so nothing
# async is pulled and the book is driven in-process/synchronously. Transitive:
# orderbook-rs ~0.11 (special_orders), pricelevel ~0.8, dashmap 6, uuid,
# crossbeam-skiplist — all MIT/Apache-2.0. Audit note: what — the option-chain
# matching leaf the realistic fill routes through; why — order-book-level fills
# are the crate differentiator; licence — MIT. `cargo audit` / `cargo deny`
# stay green (allow-list extended for any new transitive licence).
option-chain-orderbook = { version = "0.9", default-features = false, optional = true }
# optionstratlib 0.17 boundary shim — feature `orderbook` only. UNAVOIDABLE
# version bridge: published `option-chain-orderbook` (0.9.1) pins optionstratlib
# `^0.17`, while this crate is on optionstratlib 0.18, so the resolver keeps two
# semver-incompatible optionstratlib copies. `OptionOrderBook::new(symbol,
# OptionStyle)` takes an `optionstratlib::OptionStyle` **by value** and the crate
# does not re-export it, so the leaf constructor must be handed the 0.17 type.
# This renamed dep names that one enum (a trivial `Call`/`Put`) at the seam in
# `src/execution/realistic.rs` and nowhere else; the whole crate otherwise uses
# optionstratlib 0.18. Licence: MIT. DEVIATION for architect review — remove
# this shim once `option-chain-orderbook` republishes on optionstratlib 0.18 (or
# re-exports `OptionStyle`); see the module docs in `realistic.rs`.
optionstratlib_ob = { package = "optionstratlib", version = "0.17", default-features = false, optional = true }
# PyO3 — the Rust↔Python FFI layer, feature `python` only (#38, ADR-0005),
# absent from the default / crates.io build. `abi3-py310` targets the stable
# ABI from Python 3.10, so ONE `cp310-abi3` wheel serves 3.10+ instead of one
# wheel per (platform × minor). The default `macros` feature is kept (it
# provides `#[pymodule]`); `extension-module` is intentionally NOT listed here
# — maturin injects `pyo3/extension-module` for the wheel build only, so
# `cargo test --all-features` still links libpython and runs (see the `python`
# feature note above). The macro-generated glue is the ONLY tolerated `unsafe`;
# the crate keeps `#![forbid(unsafe_code)]`, verified at build. Audit note:
# what — the PyO3 binding leaf behind the `python` feature; why — the
# first-class Python surface (ADR-0005); licence — MIT OR Apache-2.0. It adds
# 7 crates to Cargo.lock (all vetted green by `cargo audit` + `cargo deny`):
# pyo3 0.29.0, pyo3-ffi 0.29.0, pyo3-macros 0.29.0, pyo3-macros-backend 0.29.0,
# pyo3-build-config 0.29.0 and heck 0.5.0 — all `MIT OR Apache-2.0`; plus the
# build-dep target-lexicon 0.13.5 — `Apache-2.0 WITH LLVM-exception`, which a
# plain `Apache-2.0` allow does NOT satisfy (a WITH expression needs its own
# SPDX entry; there is no OR fallback), so `deny.toml` allow-lists it
# explicitly with a note (the LLVM exception only relaxes Apache-2.0, strictly
# more permissive). Adding these rewrites Cargo.lock, so the
# `lockfile_sha256` build-identity shifts and the two run-id-stamped golden
# fixtures (bundle_golden, conformance) are re-blessed in this same change — the
# documented dependency-change workflow (tests/bundle_golden.rs §Build identity).
# NOTE: `extension-module` is intentionally NOT a cargo feature — that would let
# `--all-features` enable it and break the `cargo test` executable link; maturin
# injects `pyo3/extension-module` for the wheel build only (python/pyproject.toml).
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }

[dev-dependencies]
positive = "0.5"
proptest = "1"
rust_decimal_macros = "1"
serde_json = "1"
# Scratch Parquet fixtures are generated into a tempdir in-test — no committed
# binary. Licence: MIT OR Apache-2.0.
tempfile = "3"
# Benchmark harness for the `benches/` suite (#18). `criterion` drives warmup +
# sample scheduling; the naive-throughput bench collects per-iteration latencies
# into an `hdrhistogram` and reports p50/p99/p99.9/p99.99 itself (the `bench-hdr`
# convention, docs/07 §5) rather than criterion's mean/median. Both are
# dev-only — never compiled by `cargo build`/`cargo test`, only under
# `cargo bench` — and neither reaches the shipped crate or the PyO3 boundary.
# Audit note: `criterion` — Apache-2.0 OR MIT; `hdrhistogram` — MIT OR
# Apache-2.0. `cargo audit` / `cargo deny` stay green; `#![forbid(unsafe_code)]`
# in `ironcondor` itself is unaffected (both are dev-deps, outside the crate).
# `criterion` with `default-features = false` drops the optional
# `plotters`/HTML-report and `rayon` stacks; `cargo_bench_support` is kept so
# `cargo bench` still drives the harness. Keeps the added surface minimal.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }
hdrhistogram = "7"

# The naive-mode throughput baseline (#18): full `run_backtest` over a canonical
# Parquet iron-condor chain, single strategy, single core. `harness = false` so
# criterion's own `main` runs (this bench provides `criterion_main!`), not the
# libtest harness. Shares its fixed scenario with `realistic_overhead` via
# `benches/common/mod.rs`.
[[bench]]
name = "naive_throughput"
harness = false

# The realistic-vs-naive overhead A/B (#29, PB-3): the SAME fixed condor scenario
# as `naive_throughput`, run through `run_backtest` in both modes, reporting the
# dimensionless realistic/naive overhead ratio. `required-features = ["orderbook"]`
# so it compiles ONLY with the matching engine (the default build never sees it);
# `harness = false` for the same reason as above.
[[bench]]
name = "realistic_overhead"
harness = false
required-features = ["orderbook"]

# The bundle-writer scaling bench (#37, PB-5): `write_bundle` timed over
# `BacktestRun`s of growing length (positions table 1k/8k/32k/128k rows,
# straddling the 8192-row Parquet batch), proving O(rows) single-pass linear
# time. The writer is in the default build (naive), so NO `required-features`;
# `harness = false` for the same reason as above. The companion peak-memory
# measurement + PB-5 assertions live in `tests/bundle_write_pb5.rs`.
[[bench]]
name = "bundle_write"
harness = false

# The conversion-boundary scaling bench (#51, PB-4): `raw_quotes_to_snapshot`
# (the O(contracts) DTO-independent validation core in `src/data/convert.rs`)
# timed over snapshots of growing contract count (512 / 2 048 / 8 192, a 16x
# sweep), proving the per-contract cost stays ~flat so a super-linear regression
# is caught. The core is in the default build (every feed reuses it), so NO
# `required-features`; `harness = false` for the same reason as the other
# benches. Read-only: the bench only calls the public conversion API.
[[bench]]
name = "conversion"
harness = false

# The PyO3 boundary marshalling bench (#43, PB-6): the Rust-side per-call
# marshalling cost of the binding with the engine elided — the config builder
# chain (marshal-in path) + a single-crossing floor — driven through the real
# registered `#[pymodule]` in an embedded interpreter. `required-features =
# ["python"]` so it compiles ONLY with the PyO3 binding (and links libpython, so
# build/run it with `PYO3_PYTHON=python3.12`); the default build never sees it.
# `harness = false` for the same reason as the other benches. The companion
# Python-side per-call-vs-batch amortisation measurement is the manual script
# `python/benches/pyo3_overhead.py` (documented in BENCH.md §H5, kept out of the
# pytest gates).
[[bench]]
name = "pyo3_marshal"
harness = false
required-features = ["python"]
