[package]
name = "ironcondor"
version = "0.0.1"
edition = "2024"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "High-performance backtesting engine for options trading strategies with order-book-level fill simulation. Built on OptionStratLib."
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/IronCondor"
homepage = "https://github.com/joaquinbejar/IronCondor"
keywords = ["finance", "options", "trading", "backtesting", "quant"]
categories = ["finance", "simulation"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "ironcondor"
path = "src/lib.rs"
# Declared unconditionally — Cargo cannot toggle crate-type by feature.
# Without the `python` feature the cdylib links no PyO3 and is inert.
crate-type = ["rlib", "cdylib"]

[features]
# default — engine + naive execution + historical feeds.
default = []
# orderbook — realistic execution via option-chain-orderbook.
orderbook = []
# simulator — synthetic chain sessions via OptionChain-Simulator over HTTP.
# Pulls the async transport (reqwest) + a minimal tokio runtime + serde_json
# for the wire DTOs; NONE of these compile in the default build.
simulator = ["dep:reqwest", "dep:tokio", "dep:serde_json"]
# python — PyO3 bindings built with maturin.
python = []

[dependencies]
chrono = "0.4"
optionstratlib = { version = "0.18", default-features = false }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Columnar stack for the Parquet historical feed (the default v0.1 release
# feed) and, later, the result-bundle writer (#34, ADR-0004) — one stack,
# read and write. `default-features = false` drops parquet's async path
# (tokio/futures); `arrow` enables the record-batch reader, `snap` the
# ubiquitous Snappy page codec. Licence: Apache-2.0.
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
# Streaming file sha256 = the tape data-identity for file feeds. Licence:
# MIT OR Apache-2.0.
sha2 = "0.10"
# Seeded ChaCha8Rng — the run's SOLE randomness source (docs/02 §7); seeded
# from config.seed so `(seed, config, data)` is byte-reproducible. Never
# `thread_rng`. `ChaCha8Rng` + its re-exported `rand_core::SeedableRng` are the
# only surface used; no `rand` facade is pulled. Licence: MIT OR Apache-2.0.
rand_chacha = { version = "0.3", default-features = false }
# simulator feed transport — feature-gated, absent from the default build.
# reqwest: pure-Rust rustls TLS (no system OpenSSL, reproducible CI) + json.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
# tokio: only the pieces the async client + its test harness need.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
], optional = true }
# serde_json: the tagged `method`/`parameters` wire fields carry raw JSON.
serde_json = { version = "1", optional = true }

[dev-dependencies]
positive = "0.5"
proptest = "1"
rust_decimal_macros = "1"
serde_json = "1"
# Scratch Parquet fixtures are generated into a tempdir in-test — no committed
# binary. Licence: MIT OR Apache-2.0.
tempfile = "3"
# Benchmark harness for the `benches/` suite (#18). `criterion` drives warmup +
# sample scheduling; the naive-throughput bench collects per-iteration latencies
# into an `hdrhistogram` and reports p50/p99/p99.9/p99.99 itself (the `bench-hdr`
# convention, docs/07 §5) rather than criterion's mean/median. Both are
# dev-only — never compiled by `cargo build`/`cargo test`, only under
# `cargo bench` — and neither reaches the shipped crate or the PyO3 boundary.
# Audit note: `criterion` — Apache-2.0 OR MIT; `hdrhistogram` — MIT OR
# Apache-2.0. `cargo audit` / `cargo deny` stay green; `#![forbid(unsafe_code)]`
# in `ironcondor` itself is unaffected (both are dev-deps, outside the crate).
# `criterion` with `default-features = false` drops the optional
# `plotters`/HTML-report and `rayon` stacks; `cargo_bench_support` is kept so
# `cargo bench` still drives the harness. Keeps the added surface minimal.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }
hdrhistogram = "7"

# The naive-mode throughput baseline (#18): full `run_backtest` over a canonical
# Parquet iron-condor chain, single strategy, single core. `harness = false` so
# criterion's own `main` runs (this bench provides `criterion_main!`), not the
# libtest harness.
[[bench]]
name = "naive_throughput"
harness = false
