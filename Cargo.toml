[package]
name = "ironcondor"
version = "0.0.1"
edition = "2024"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "High-performance backtesting engine for options trading strategies with order-book-level fill simulation. Built on OptionStratLib."
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/IronCondor"
homepage = "https://github.com/joaquinbejar/IronCondor"
keywords = ["finance", "options", "trading", "backtesting", "quant"]
categories = ["finance", "simulation"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "ironcondor"
path = "src/lib.rs"
# Declared unconditionally — Cargo cannot toggle crate-type by feature.
# Without the `python` feature the cdylib links no PyO3 and is inert.
crate-type = ["rlib", "cdylib"]

[features]
# default — engine + naive execution + historical feeds.
default = []
# orderbook — realistic execution via option-chain-orderbook.
orderbook = []
# simulator — synthetic chain sessions via OptionChain-Simulator over HTTP.
# Pulls the async transport (reqwest) + a minimal tokio runtime + serde_json
# for the wire DTOs; NONE of these compile in the default build.
simulator = ["dep:reqwest", "dep:tokio", "dep:serde_json"]
# python — PyO3 bindings built with maturin.
python = []

[dependencies]
chrono = "0.4"
optionstratlib = { version = "0.18", default-features = false }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# simulator feed transport — feature-gated, absent from the default build.
# reqwest: pure-Rust rustls TLS (no system OpenSSL, reproducible CI) + json.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
# tokio: only the pieces the async client + its test harness need.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
], optional = true }
# serde_json: the tagged `method`/`parameters` wire fields carry raw JSON.
serde_json = { version = "1", optional = true }

[dev-dependencies]
positive = "0.5"
proptest = "1"
rust_decimal_macros = "1"
serde_json = "1"
